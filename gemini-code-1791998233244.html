<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>EV Charging Schedule Tool</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h2 {
      margin: 0 0 18px;
      font-size: 1.35rem;
      color: #111;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 6px;
      font-size: 0.9rem;
      color: #333;
    }
    input[type="number"], input[type="time"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      background: #fff;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .toggle-btn {
      flex: 1;
      padding: 10px 8px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #444;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-btn.active {
      border-color: #007aff;
      background: #007aff;
      color: #fff;
    }
    .result-box {
      margin-top: 22px;
      padding: 16px;
      background: #f0f8f1;
      border: 1px solid #bfe3c2;
      border-radius: 10px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #333;
    }
    .result-row.primary {
      padding-top: 6px;
      border-top: 1px dashed #bfe3c2;
    }
    .result-row.alert {
      margin-bottom: 0;
      padding-top: 6px;
      border-top: 1px dashed #f5c6cb;
    }
    .highlight {
      font-weight: 700;
      font-size: 1.25rem;
      color: #1e7e34;
    }
    .highlight-alert {
      font-weight: 700;
      font-size: 1.25rem;
      color: #c82333;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>EV Charging Schedule Tool</h2>

  <label>Calculation Mode</label>
  <div class="btn-group">
    <button type="button" class="toggle-btn" id="mode-departure" onclick="setMode('departure')">Set Departure Time</button>
    <button type="button" class="toggle-btn active" id="mode-now" onclick="setMode('now')">Start Charging Now</button>
  </div>

  <label for="current">Current Battery (%)</label>
  <input type="number" id="current" value="61" min="0" max="100">

  <label for="target">Target Battery (%)</label>
  <select id="target"></select>

  <label>Charging Rate</label>
  <div class="btn-group">
    <button type="button" class="toggle-btn active" id="rate-8" onclick="setRate(8)">8% / hr</button>
    <button type="button" class="toggle-btn" id="rate-10" onclick="setRate(10)">10% / hr</button>
  </div>

  <div id="departure-group" style="display: none;">
    <label for="leave">Departure Time</label>
    <input type="time" id="leave" value="17:00">
  </div>

  <div class="result-box">
    <div class="result-row">
      <span>Gain Needed:</span>
      <span id="gain" class="highlight">24%</span>
    </div>
    <div class="result-row">
      <span>Duration:</span>
      <span id="duration" class="highlight">3h 0m</span>
    </div>
    <div class="result-row primary">
      <span id="time-label">Done Charging At:</span>
      <span id="target-time" class="highlight">--</span>
    </div>
    <div class="result-row alert" id="must-leave-row">
      <span>Must Leave By (+45m):</span>
      <span id="must-leave-time" class="highlight-alert">--</span>
    </div>
  </div>
</div>

<script>
  let mode = 'now';     // Default to workplace charging starting now
  let selectedRate = 8; // 8% or 10%
  const GRACE_PERIOD_MINS = 45;

  // Populate target dropdown: 20% to 90% in 5% steps
  const targetSelect = document.getElementById('target');
  for (let pct = 20; pct <= 90; pct += 5) {
    const opt = document.createElement('option');
    opt.value = pct;
    opt.textContent = `${pct}%`;
    if (pct === 85) opt.selected = true;
    targetSelect.appendChild(opt);
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('mode-departure').classList.toggle('active', mode === 'departure');
    document.getElementById('mode-now').classList.toggle('active', mode === 'now');
    document.getElementById('departure-group').style.display = mode === 'departure' ? 'block' : 'none';
    document.getElementById('must-leave-row').style.display = mode === 'now' ? 'flex' : 'none';
    document.getElementById('time-label').textContent = mode === 'departure' ? 'Start Charging At:' : 'Done Charging At:';
    calculate();
  }

  function setRate(rate) {
    selectedRate = rate;
    document.getElementById('rate-8').classList.toggle('active', rate === 8);
    document.getElementById('rate-10').classList.toggle('active', rate === 10);
    calculate();
  }

  function formatTime(dateObj) {
    let hours = dateObj.getHours();
    const minutes = dateObj.getMinutes();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    const formattedM = String(minutes).padStart(2, '0');
    return `${hours}:${formattedM} ${ampm}`;
  }

  function calculate() {
    const current = parseFloat(document.getElementById('current').value) || 0;
    const target = parseFloat(document.getElementById('target').value) || 0;
    const leaveVal = document.getElementById('leave').value;

    if (target <= current) {
      document.getElementById('gain').textContent = '0%';
      document.getElementById('duration').textContent = '0 min';
      document.getElementById('target-time').textContent = 'Already at target';
      document.getElementById('must-leave-time').textContent = 'Now';
      return;
    }

    const neededPercent = target - current;
    const totalMinutes = Math.round((neededPercent / selectedRate) * 60);

    const hours = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;

    document.getElementById('gain').textContent = `${neededPercent}%`;
    document.getElementById('duration').textContent = `${hours}h ${mins}m`;

    if (mode === 'departure') {
      if (leaveVal) {
        const [leaveH, leaveM] = leaveVal.split(':').map(Number);
        let leaveTotalMins = leaveH * 60 + leaveM;
        let startTotalMins = (leaveTotalMins - totalMinutes) % 1440;
        if (startTotalMins < 0) startTotalMins += 1440;

        const startH24 = Math.floor(startTotalMins / 60);
        const startM = startTotalMins % 60;
        const startDate = new Date();
        startDate.setHours(startH24, startM, 0);

        document.getElementById('target-time').textContent = formatTime(startDate);
      }
    } else {
      // Start charging now
      const nowMs = Date.now();
      const doneDate = new Date(nowMs + totalMinutes * 60 * 1000);
      const mustLeaveDate = new Date(doneDate.getTime() + GRACE_PERIOD_MINS * 60 * 1000);

      document.getElementById('target-time').textContent = formatTime(doneDate);
      document.getElementById('must-leave-time').textContent = formatTime(mustLeaveDate);
    }
  }

  ['current', 'target', 'leave'].forEach(id => {
    document.getElementById(id).addEventListener('input', calculate);
  });

  calculate();
</script>

</body>
</html>
